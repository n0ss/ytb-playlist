[project]
name = "ytb-playlist"
version = "0.1.0.dev0"
description = "Download YouTube playlists as MP3 or MP4, named by date and tagged for Apple Music"
requires-python = ">=3.14"
dependencies = [
    "mutagen>=1.48.1,<1.49",
    "pillow>=13.0.0",
    "rich>=15.0.0",
    "typer>=0.27,<0.28",
]

[project.scripts]
ytb-playlist = "ytb_playlist.cli.app:app"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not network'"
markers = ["network: needs YouTube access; run with -m network"]

[tool.ruff]
line-length = 100
